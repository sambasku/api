# Staging homelab - service app saja. sqld terpisah di host yang sama.
# Acuan: docs/api/DOCKERIZE_STAGING_HOMELAB.md
#
# Default sekarang: BUILD LOKAL (GHCR image lama masih tanpa --chown=node:node).
# Setelah CI push image baru yang sudah chown:
#   PULL_POLICY=always API_IMAGE=ghcr.io/sambasku/api:staging docker compose up -d
#
# Di .env: DATABASE_URL=http://host.docker.internal:8080 + secret staging.
# Bind: 127.0.0.1:8181 atau APP_BIND_HOST=100.71.13.88

name: sambasku-api-staging

services:
  app:
    # Tag lokal agar tidak ketarik image GHCR lama yang bug
    image: ${API_IMAGE:-sambasku-api:local-staging}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sambasku-api-staging
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-never}
    env_file:
      - .env
    environment:
      NODE_ENV: staging
      PORT: "8181"
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:8181:8181"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8181/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
