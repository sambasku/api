name: Deploy Staging (Homelab / GHCR)

# Push branch `staging` saja (tanpa pipeline tag):
#   test (SQLite) → migrate Turso staging → publish image :staging + :sha-…
#
# Homelab: ghcr.io/sambasku/api:staging → ./scripts/staging-up.sh
# Acuan: docs/api/DOCKERIZE_STAGING_HOMELAB.md
#
# Secrets: TURSO_STAGING_DATABASE_URL, TURSO_STAGING_AUTH_TOKEN
# GITHUB_TOKEN bawaan cukup untuk push package (permissions.packages: write).

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Siapkan .env.test (file SQLite + JWT dummy)
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt_private.pem
          openssl pkey -in jwt_private.pem -pubout -out jwt_public.pem
          {
            echo "NODE_ENV=test"
            echo "DATABASE_URL=file:./test.db"
            echo "DATABASE_AUTH_TOKEN="
            echo "JWT_PRIVATE_KEY=\"$(cat jwt_private.pem)\""
            echo "JWT_PUBLIC_KEY=\"$(cat jwt_public.pem)\""
            echo "CORS_ALLOWED_ORIGINS=http://localhost:5173"
            echo "OAUTH_REQUIRE_AZP=true"
          } > .env.test
          rm jwt_private.pem jwt_public.pem
      - run: pnpm db:migrate
        env:
          DATABASE_URL: file:./test.db
      - run: pnpm typecheck
      - run: pnpm test

  migrate-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Cek secrets Turso staging
        env:
          DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret TURSO_STAGING_DATABASE_URL kosong - set di GitHub → Settings → Secrets"
            exit 1
          fi
          if [ -z "$DATABASE_AUTH_TOKEN" ]; then
            echo "::error::Secret TURSO_STAGING_AUTH_TOKEN kosong - set di GitHub → Settings → Secrets"
            exit 1
          fi
          echo "Turso URL host: $(echo "$DATABASE_URL" | sed -E 's#^[a-z]+://##')"
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

  publish-image:
    needs: migrate-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  notify:
    needs: [test, migrate-staging, publish-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }} CI sambasku/api — Deploy Staging (Homelab / GHCR)
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            https://github.com/sambasku/api/actions/runs/${{ github.run_id }}
      - name: Kirim hasil CI ke Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: "${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }}"
          REPO: sambasku/api
          WORKFLOW: Deploy Staging (Homelab / GHCR)
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: "https://github.com/sambasku/api/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="$STATUS CI $REPO — $WORKFLOW
          Branch: $BRANCH · Commit: $SHA
          $RUN_URL"
          jq -n --arg content "$MSG" '{{content: $content}}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"
