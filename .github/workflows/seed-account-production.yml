name: Seed Account Production (manual)

# Hanya akun default (admin/root/contributor/reviewer).
# Insert-only: skip jika username sudah ada (tidak menimpa password/role/email).
# TIDAK otomatis saat push/deploy.
#
# CLI: gh workflow run seed-account-production.yml --ref main -f confirm=true
#
# Secrets: TURSO_PRODUCTION_DATABASE_URL, TURSO_PRODUCTION_AUTH_TOKEN

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Centang untuk seed akun PRODUCTION (insert-only; skip user yang sudah ada)'
        type: boolean
        required: true
        default: false

jobs:
  seed:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Cek secrets Turso production
        env:
          DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret TURSO_PRODUCTION_DATABASE_URL kosong"
            exit 1
          fi
          if [ -z "$DATABASE_AUTH_TOKEN" ]; then
            echo "::error::Secret TURSO_PRODUCTION_AUTH_TOKEN kosong"
            exit 1
          fi
          echo "Turso secrets OK"

      - name: Seed accounts production
        run: pnpm seed:accounts
        env:
          NODE_ENV: production
          SEED_ACCOUNTS_INSERT_ONLY: '1'
          DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
          JWT_PRIVATE_KEY: dummy
          JWT_PUBLIC_KEY: dummy
          CORS_ALLOWED_ORIGINS: https://sambasku.com,https://console.sambasku.com
