name: DB Migrate (manual)

# Terapkan migrasi Drizzle ke Turso tanpa deploy image / tanpa seed penuh.
# Pakai untuk schema baru (mis. `0183_leaderboard_excluded_users`) setelah
# image API sudah naik lebih dulu.
#
# CLI:
#   gh workflow run db-migrate.yml --repo sambasku/api --ref staging -f target=staging
#   gh workflow run db-migrate.yml --repo sambasku/api --ref staging -f target=staging -f seed_reference=true
#
# Secrets org: DB_*_TURSO_URL, DB_*_TURSO_AUTH_TOKEN

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      seed_reference:
        description: Jalankan pnpm seed:reference setelah migrate (user sistem + exclude leaderboard)
        required: false
        default: false
        type: boolean

concurrency:
  group: db-migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cek secrets Turso (staging)
        if: inputs.target == 'staging'
        env:
          DATABASE_URL: ${{ secrets.DB_STAGING_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_STAGING_TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DB_STAGING_TURSO_URL kosong"
            exit 1
          fi
          if [ -z "$DATABASE_AUTH_TOKEN" ]; then
            echo "::error::Secret DB_STAGING_TURSO_AUTH_TOKEN kosong"
            exit 1
          fi
          echo "DB URL host: $(echo "$DATABASE_URL" | sed -E 's#^[a-z]+://##')"

      - name: Cek secrets Turso (production)
        if: inputs.target == 'production'
        env:
          DATABASE_URL: ${{ secrets.DB_PRODUCTION_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_PRODUCTION_TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DB_PRODUCTION_TURSO_URL kosong"
            exit 1
          fi
          if [ -z "$DATABASE_AUTH_TOKEN" ]; then
            echo "::error::Secret DB_PRODUCTION_TURSO_AUTH_TOKEN kosong"
            exit 1
          fi
          echo "DB URL host: $(echo "$DATABASE_URL" | sed -E 's#^[a-z]+://##')"

      - name: Migrate staging
        if: inputs.target == 'staging'
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DB_STAGING_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_STAGING_TURSO_AUTH_TOKEN }}

      - name: Migrate production
        if: inputs.target == 'production'
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DB_PRODUCTION_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_PRODUCTION_TURSO_AUTH_TOKEN }}

      - name: Verifikasi tabel leaderboard_excluded_users
        if: inputs.target == 'staging'
        run: pnpm exec tsx src/scripts/verify-leaderboard-exclusions-table.ts
        env:
          DATABASE_URL: ${{ secrets.DB_STAGING_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_STAGING_TURSO_AUTH_TOKEN }}

      - name: Verifikasi tabel leaderboard_excluded_users (production)
        if: inputs.target == 'production'
        run: pnpm exec tsx src/scripts/verify-leaderboard-exclusions-table.ts
        env:
          DATABASE_URL: ${{ secrets.DB_PRODUCTION_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_PRODUCTION_TURSO_AUTH_TOKEN }}

      - name: Seed reference staging
        if: inputs.target == 'staging' && inputs.seed_reference
        run: pnpm seed:reference
        env:
          NODE_ENV: staging
          DATABASE_URL: ${{ secrets.DB_STAGING_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_STAGING_TURSO_AUTH_TOKEN }}
          JWT_PRIVATE_KEY: dummy
          JWT_PUBLIC_KEY: dummy
          CORS_ALLOWED_ORIGINS: https://console-sambasku-staging.iamutaki.com

      - name: Seed reference production
        if: inputs.target == 'production' && inputs.seed_reference
        run: pnpm seed:reference
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DB_PRODUCTION_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_PRODUCTION_TURSO_AUTH_TOKEN }}
          JWT_PRIVATE_KEY: dummy
          JWT_PUBLIC_KEY: dummy
          CORS_ALLOWED_ORIGINS: https://console-sambasku.iamutaki.com

  notify:
    needs: [migrate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }} CI sambasku/api — DB Migrate (manual) (${{ inputs.target }})
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            https://github.com/sambasku/api/actions/runs/${{ github.run_id }}