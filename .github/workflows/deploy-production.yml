name: Deploy Production (Cloudflare Workers)

# Tag semver polos `vX.Y.Z` (contoh v0.1.2) → test → migrate → Workers + image GHCR.
# 1:1 dengan deploy-staging (beda: secret prod + target Workers).
# Tag `v*-staging` ditolak. Branch `main` bukan trigger.
#
# Secrets GitHub:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   TURSO_PRODUCTION_DATABASE_URL   - libsql://…
#   TURSO_PRODUCTION_AUTH_TOKEN
#
# Secret Worker (DATABASE_URL + DATABASE_AUTH_TOKEN + JWT …) TIDAK perlu di CI -
# `wrangler deploy` mempertahankan secret yang sudah terpasang.
# Production = top-level di wrangler.toml (bukan --env); staging pakai --env staging.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-staging'))
    steps:
      - uses: actions/checkout@v7
      - name: Pastikan tag produksi vX.Y.Z
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag harus vMAJOR.MINOR.PATCH, dapat: $TAG" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Siapkan .env.test (file SQLite + JWT dummy)
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt_private.pem
          openssl pkey -in jwt_private.pem -pubout -out jwt_public.pem
          {
            echo "NODE_ENV=test"
            echo "DATABASE_URL=file:./test.db"
            echo "DATABASE_AUTH_TOKEN="
            echo "JWT_PRIVATE_KEY=\"$(cat jwt_private.pem)\""
            echo "JWT_PUBLIC_KEY=\"$(cat jwt_public.pem)\""
            echo "CORS_ALLOWED_ORIGINS=http://localhost:5173"
            echo "OAUTH_REQUIRE_AZP=true"
          } > .env.test
          rm jwt_private.pem jwt_public.pem
      - run: pnpm db:migrate
        env:
          DATABASE_URL: file:./test.db
      - run: pnpm typecheck
      - run: pnpm test

  migrate-production:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Cek secrets Turso production
        env:
          DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret TURSO_PRODUCTION_DATABASE_URL kosong - set di GitHub → Settings → Secrets"
            exit 1
          fi
          if [ -z "$DATABASE_AUTH_TOKEN" ]; then
            echo "::error::Secret TURSO_PRODUCTION_AUTH_TOKEN kosong - set di GitHub → Settings → Secrets"
            exit 1
          fi
          echo "Turso URL host: $(echo "$DATABASE_URL" | sed -E 's#^[a-z]+://##')"
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}

  deploy:
    needs: migrate-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Top-level wrangler.toml = production (sambasku-api). Jangan --env staging.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


  publish-image:
    needs: migrate-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
      - name: Sync package.json version dari git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version || '')) {
            console.error(`VERSION tidak valid: ${version}`);
            process.exit(1);
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const before = pkg.version;
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`package.json version: ${before} → ${version}`);
          NODE
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=production
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  notify:
    needs: [test, migrate-production, deploy, publish-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }} CI sambasku/api — Deploy Production (Cloudflare Workers)
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            https://github.com/sambasku/api/actions/runs/${{ github.run_id }}
      - name: Kirim hasil CI ke Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: "${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }}"
          REPO: sambasku/api
          WORKFLOW: Deploy Production (Cloudflare Workers)
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: "https://github.com/sambasku/api/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="$STATUS CI $REPO — $WORKFLOW
          Branch: $BRANCH · Commit: $SHA
          $RUN_URL"
          jq -n --arg content "$MSG" '{{content: $content}}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"
