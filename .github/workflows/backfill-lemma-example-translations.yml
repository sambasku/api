name: Backfill Lemma Example Translations

# Sekali jalan (workflow_dispatch): promote examples published + target_sentence
# → translations (reff=lemma_example, accepted). Idempoten via upsertAccepted.
# Jalankan berurutan: staging dulu, lalu production.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Database target backfill'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: backfill-lemma-example-translations-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Backfill staging
        if: inputs.target == 'staging'
        run: pnpm db:backfill-lemma-example-translations
        env:
          NODE_ENV: staging
          DATABASE_URL: ${{ secrets.DB_STAGING_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_STAGING_TURSO_AUTH_TOKEN }}
          JWT_PRIVATE_KEY: dummy
          JWT_PUBLIC_KEY: dummy
          CORS_ALLOWED_ORIGINS: https://console-sambasku-staging.iamutaki.com
      - name: Backfill production
        if: inputs.target == 'production'
        run: pnpm db:backfill-lemma-example-translations
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DB_PRODUCTION_TURSO_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DB_PRODUCTION_TURSO_AUTH_TOKEN }}
          JWT_PRIVATE_KEY: dummy
          JWT_PUBLIC_KEY: dummy
          CORS_ALLOWED_ORIGINS: https://console.sambasku.com
