name: Seed Reference Staging (manual)

# Referensi + user sistem (Anonim, Importir Data CSV).
# Insert-if-missing saja - aman diulang, tidak menimpa password akun login.
#
# CLI: gh workflow run seed-reference-staging.yml --ref staging
#
# Secrets: TURSO_STAGING_DATABASE_URL, TURSO_STAGING_AUTH_TOKEN

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Seed reference staging
        run: pnpm seed:reference
        env:
          NODE_ENV: staging
          DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}
          JWT_PRIVATE_KEY: dummy
          JWT_PUBLIC_KEY: dummy
          CORS_ALLOWED_ORIGINS: https://console-sambasku-staging.iamutaki.com

  notify:
    needs: [seed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }} CI sambasku/api — Seed Reference Staging (manual)
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            https://github.com/sambasku/api/actions/runs/${{ github.run_id }}
      - name: Kirim hasil CI ke Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: "${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }}"
          REPO: sambasku/api
          WORKFLOW: Seed Reference Staging (manual)
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: "https://github.com/sambasku/api/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="$STATUS CI $REPO — $WORKFLOW
          Branch: $BRANCH · Commit: $SHA
          $RUN_URL"
          jq -n --arg content "$MSG" '{{content: $content}}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"
